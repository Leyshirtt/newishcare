<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem POS Kasir Toko Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Screen Lock / Login Overlay -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl border border-gray-100 text-center">
            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl font-black">
                <i class="fas fa-lock"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Login Kasir POS</h2>
            <p class="text-sm text-gray-500 mb-6">Masukkan PIN untuk masuk ke sistem</p>

            <div class="space-y-4">
                <input type="password" id="pinInput" placeholder="Masukkan PIN" maxlength="6" class="w-full text-center text-2xl tracking-widest py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-600 focus:outline-none font-bold">
                <button onclick="attemptLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg transition">Masuk</button>
            </div>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar Navigation -->
        <div class="w-20 bg-slate-900 flex flex-col items-center py-6 justify-between text-white border-r border-slate-800">
            <div class="flex flex-col items-center space-y-6">
                <div class="bg-indigo-600 p-3 rounded-2xl text-xl font-bold shadow-lg shadow-indigo-600/30">POS</div>
                <button onclick="switchTab('pos')" class="p-3 rounded-xl hover:bg-slate-800 transition text-indigo-400" title="Kasir Utama"><i class="fas fa-cash-register text-xl"></i></button>
                <button id="navManageBtn" onclick="openManageModal()" class="p-3 rounded-xl hover:bg-slate-800 transition text-gray-400 hover:text-white" title="Kelola Produk"><i class="fas fa-box-archive text-xl"></i></button>
                <button id="navReportsBtn" onclick="openReportsModal()" class="p-3 rounded-xl hover:bg-slate-800 transition text-gray-400 hover:text-white" title="Laporan Omzet"><i class="fas fa-chart-line text-xl"></i></button>
            </div>
            <button onclick="logout()" class="p-3 rounded-xl hover:bg-red-500/20 text-gray-400 hover:text-red-400 transition" title="Logout"><i class="fas fa-right-from-bracket text-xl"></i></button>
        </div>

        <!-- Main Workspace -->
        <div class="flex-1 flex flex-col overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Kasir Utama</h1>
                    <p class="text-sm text-gray-500">Logged in as: <span id="currentUserRole" class="font-bold text-indigo-600 uppercase">Kasir</span></p>
                </div>
                <div class="flex items-center space-x-3">
                    <button id="adminManageBtn" onclick="openManageModal()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2">
                        <i class="fas fa-plus-circle"></i> Kelola Produk
                    </button>
                    <button id="adminReportBtn" onclick="openReportsModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 shadow-md shadow-indigo-200">
                        <i class="fas fa-file-excel"></i> Laporan & Export
                    </button>
                </div>
            </div>

            <!-- Products Catalog & Shopping Cart -->
            <div class="flex-1 flex gap-6 overflow-hidden">
                <!-- Product Grid -->
                <div class="flex-1 flex flex-col overflow-hidden bg-white rounded-2xl shadow-sm border border-gray-200 p-4">
                    <div class="mb-4">
                        <div class="relative">
                            <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                            <input type="text" id="searchInput" oninput="renderProducts()" placeholder="Cari nama barang..." class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                    </div>
                    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 overflow-y-auto p-1"></div>
                </div>

                <!-- Shopping Cart -->
                <div class="w-96 bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col p-4">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-gray-800">Keranjang Belanja</h2>
                        <button onclick="clearCart()" class="text-xs text-red-500 hover:underline">Kosongkan</button>
                    </div>
                    
                    <div id="cartList" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>

                    <div class="border-t border-gray-100 pt-4 mt-4 space-y-3">
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-500">Subtotal</span>
                            <span id="subtotalText" class="font-semibold text-gray-800">Rp 0</span>
                        </div>

                        <!-- Toggle PPN (Default OFF) -->
                        <div class="flex justify-between items-center text-sm bg-gray-50 p-2.5 rounded-xl border border-gray-100">
                            <span class="text-gray-700 font-medium">PPN (11%)</span>
                            <input type="checkbox" id="ppnToggle" onchange="renderCart()" class="w-4 h-4 text-indigo-600 rounded cursor-pointer">
                        </div>

                        <div class="flex justify-between text-sm">
                            <span class="text-gray-500">Nilai PPN</span>
                            <span id="ppnText" class="font-semibold text-gray-800">Rp 0</span>
                        </div>

                        <div class="flex justify-between items-center text-lg font-bold border-t border-gray-100 pt-3">
                            <span class="text-gray-900">Total Bayar</span>
                            <span id="totalText" class="text-indigo-600 text-xl">Rp 0</span>
                        </div>

                        <button onclick="processPayment()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-200 transition">Bayar Sekarang</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Kelola Produk -->
    <div id="manageModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-40">
        <div class="bg-white rounded-2xl w-full max-w-2xl p-6 shadow-2xl max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-xl font-bold text-gray-800">Kelola Produk & Harga</h3>
                <button onclick="closeManageModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <!-- Form Tambah Produk -->
            <form onsubmit="addProduct(event)" class="grid grid-cols-3 gap-3 mb-4 bg-gray-50 p-3 rounded-xl border">
                <input type="text" id="newName" placeholder="Nama Produk Baru" required class="p-2 border rounded-lg text-sm">
                <input type="number" id="newPrice" placeholder="Harga (Rp)" required class="p-2 border rounded-lg text-sm">
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg text-sm">+ Tambah Baru</button>
            </form>

            <div class="flex-1 overflow-y-auto">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-100 text-gray-700 font-bold uppercase text-xs sticky top-0">
                        <tr>
                            <th class="p-3">Nama Produk</th>
                            <th class="p-3">Harga</th>
                            <th class="p-3 text-right">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Edit Produk -->
    <div id="editProductModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-lg font-bold text-gray-800">Edit Produk</h3>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form onsubmit="saveEditProduct(event)" class="space-y-4">
                <input type="hidden" id="editProductId">
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Nama Produk</label>
                    <input type="text" id="editProductName" required class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Harga (Rp)</label>
                    <input type="number" id="editProductPrice" required class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeEditModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl text-sm">Batal</button>
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm shadow-md">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Laporan -->
    <div id="reportsModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-40">
        <div class="bg-white rounded-2xl w-full max-w-2xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-xl font-bold text-gray-800">Laporan Omzet Penjualan</h3>
                <button onclick="closeReportsModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="space-y-4">
                <div class="p-4 bg-indigo-50 rounded-2xl flex justify-between items-center border border-indigo-100">
                    <div>
                        <p class="text-xs text-indigo-600 font-bold uppercase">Total Omzet</p>
                        <p id="totalSalesAmount" class="text-2xl font-black text-indigo-900">Rp 0</p>
                    </div>
                    <div>
                        <p class="text-xs text-indigo-600 font-bold uppercase">Jumlah Transaksi</p>
                        <p id="totalTransactionCount" class="text-2xl font-black text-indigo-900">0</p>
                    </div>
                </div>
                <div class="border rounded-xl p-4 max-h-56 overflow-y-auto">
                    <ul id="historyList" class="space-y-2 text-sm"></ul>
                </div>
                <div class="flex gap-3">
                    <button onclick="exportToExcel()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2">
                        <i class="fas fa-file-excel"></i> Export ke Excel (.csv)
                    </button>
                    <button onclick="copyForGoogleSheets()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2">
                        <i class="fas fa-copy"></i> Salin ke Google Sheets
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('pos_products')) || [
            { id: 1, name: 'Kopi Susu Gula Aren', price: 18000 },
            { id: 2, name: 'Roti Bakar Cokelat', price: 15000 },
            { id: 3, name: 'Air Mineral 600ml', price: 5000 }
        ];

        let cart = [];
        let transactions = JSON.parse(localStorage.getItem('pos_transactions')) || [];
        let currentUser = null;

        function attemptLogin() {
            const pin = document.getElementById('pinInput').value.trim();
            if (pin === '1234') {
                currentUser = { role: 'kasir' };
            } else if (pin === '8888') {
                currentUser = { role: 'admin' };
            } else {
                alert('PIN Salah! Masukkan PIN Kasir atau Admin yang benar.');
                return;
            }

            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('currentUserRole').innerText = currentUser.role;
            
            const isAdmin = currentUser.role === 'admin';
            document.getElementById('adminManageBtn').style.display = isAdmin ? 'flex' : 'none';
            document.getElementById('adminReportBtn').style.display = isAdmin ? 'flex' : 'none';
            document.getElementById('navManageBtn').style.display = isAdmin ? 'block' : 'none';
            document.getElementById('navReportsBtn').style.display = isAdmin ? 'block' : 'none';

            renderProducts();
        }

        document.getElementById('pinInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') attemptLogin();
        });

        function logout() {
            currentUser = null;
            document.getElementById('pinInput').value = '';
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function saveProducts() {
            localStorage.setItem('pos_products', JSON.stringify(products));
            renderProducts();
        }

        function renderProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('productGrid');
            const filtered = products.filter(p => p.name.toLowerCase().includes(query));

            grid.innerHTML = filtered.map(p => `
                <div onclick="addToCart(${p.id})" class="bg-gray-50 hover:bg-indigo-50 border border-gray-200 hover:border-indigo-300 p-4 rounded-xl cursor-pointer transition flex flex-col justify-between">
                    <p class="font-bold text-gray-800 text-sm">${p.name}</p>
                    <p class="text-indigo-600 font-extrabold mt-3 text-sm">Rp ${p.price.toLocaleString('id-ID')}</p>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const item = cart.find(c => c.id === id);
            if (item) {
                item.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
        }

        function renderCart() {
            const cartList = document.getElementById('cartList');
            if (!cart.length) {
                cartList.innerHTML = '<p class="text-center text-gray-400 text-sm mt-10">Keranjang kosong</p>';
                document.getElementById('subtotalText').innerText = 'Rp 0';
                document.getElementById('ppnText').innerText = 'Rp 0';
                document.getElementById('totalText').innerText = 'Rp 0';
                return;
            }

            let subtotal = 0;
            cartList.innerHTML = cart.map(item => {
                subtotal += item.price * item.qty;
                return `
                    <div class="flex items-center justify-between border-b pb-2">
                        <div>
                            <p class="text-xs font-bold text-gray-800">${item.name}</p>
                            <p class="text-xs text-gray-500">Rp ${item.price.toLocaleString('id-ID')} x ${item.qty}</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 bg-gray-100 rounded font-bold hover:bg-gray-200">-</button>
                            <span class="text-xs font-bold">${item.qty}</span>
                            <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 bg-gray-100 rounded font-bold hover:bg-gray-200">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            const isPpn = document.getElementById('ppnToggle').checked;
            const ppn = isPpn ? Math.round(subtotal * 0.11) : 0;
            const total = subtotal + ppn;

            document.getElementById('subtotalText').innerText = `Rp ${subtotal.toLocaleString('id-ID')}`;
            document.getElementById('ppnText').innerText = `Rp ${ppn.toLocaleString('id-ID')}`;
            document.getElementById('totalText').innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function changeQty(id, delta) {
            const item = cart.find(c => c.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) cart = cart.filter(c => c.id !== id);
            }
            renderCart();
        }

        function clearCart() { cart = []; renderCart(); }

        function processPayment() {
            if (!cart.length) return alert('Keranjang belanja kosong!');
            const isPpn = document.getElementById('ppnToggle').checked;
            const subtotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const total = subtotal + (isPpn ? Math.round(subtotal * 0.11) : 0);

            const tx = {
                id: 'TRX-' + Date.now(),
                date: new Date().toLocaleString('id-ID'),
                items: cart.map(i => `${i.name} (${i.qty})`).join('; '),
                total: total
            };

            transactions.push(tx);
            localStorage.setItem('pos_transactions', JSON.stringify(transactions));
            alert(`Transaksi Berhasil!\nTotal: Rp ${total.toLocaleString('id-ID')}`);
            clearCart();
        }

        function openManageModal() {
            document.getElementById('manageModal').classList.remove('hidden');
            document.getElementById('manageModal').classList.add('flex');
            renderProductTable();
        }

        function closeManageModal() {
            document.getElementById('manageModal').classList.add('hidden');
            document.getElementById('manageModal').classList.remove('flex');
        }

        function renderProductTable() {
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = products.map(p => `
                <tr class="border-b">
                    <td class="p-3 font-semibold text-gray-800">${p.name}</td>
                    <td class="p-3">Rp ${p.price.toLocaleString('id-ID')}</td>
                    <td class="p-3 text-right space-x-2">
                        <button onclick="openEditModal(${p.id})" class="text-indigo-600 hover:text-indigo-800 font-bold p-1" title="Edit Barang"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteProduct(${p.id})" class="text-red-500 hover:text-red-700 font-bold p-1" title="Hapus Barang"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function addProduct(e) {
            e.preventDefault();
            const name = document.getElementById('newName').value;
            const price = parseInt(document.getElementById('newPrice').value);
            products.push({ id: Date.now(), name, price });
            saveProducts();
            document.getElementById('newName').value = '';
            document.getElementById('newPrice').value = '';
            renderProductTable();
        }

        function openEditModal(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            document.getElementById('editProductId').value = product.id;
            document.getElementById('editProductName').value = product.name;
            document.getElementById('editProductPrice').value = product.price;

            document.getElementById('editProductModal').classList.remove('hidden');
            document.getElementById('editProductModal').classList.add('flex');
        }

        function closeEditModal() {
            document.getElementById('editProductModal').classList.add('hidden');
            document.getElementById('editProductModal').classList.remove('flex');
        }

        function saveEditProduct(e) {
            e.preventDefault();
            const id = parseInt(document.getElementById('editProductId').value);
            const name = document.getElementById('editProductName').value;
            const price = parseInt(document.getElementById('editProductPrice').value);

            const product = products.find(p => p.id === id);
            if (product) {
                product.name = name;
                product.price = price;
                saveProducts();
                renderProductTable();
                closeEditModal();
            }
        }

        function deleteProduct(id) {
            if (confirm('Hapus produk ini dari katalog?')) {
                products = products.filter(p => p.id !== id);
                saveProducts();
                renderProductTable();
            }
        }

        function openReportsModal() {
            document.getElementById('reportsModal').classList.remove('hidden');
            document.getElementById('reportsModal').classList.add('flex');
            
            const totalAmount = transactions.reduce((s, t) => s + t.total, 0);
            document.getElementById('totalSalesAmount').innerText = `Rp ${totalAmount.toLocaleString('id-ID')}`;
            document.getElementById('totalTransactionCount').innerText = transactions.length;

            const history = document.getElementById('historyList');
            history.innerHTML = transactions.length ? transactions.map(t => `
                <li class="flex justify-between border-b pb-1">
                    <span>${t.id} - <small class="text-gray-400">${t.items}</small></span>
                    <strong class="text-indigo-600">Rp ${t.total.toLocaleString('id-ID')}</strong>
                </li>
            `).join('') : '<p class="text-gray-400">Belum ada data transaksi</p>';
        }

        function closeReportsModal() {
            document.getElementById('reportsModal').classList.add('hidden');
            document.getElementById('reportsModal').classList.remove('flex');
        }

        function exportToExcel() {
            if (!transactions.length) return alert('Belum ada transaksi untuk diexport!');
            let csv = "ID Transaksi,Tanggal,Item,Total\n";
            transactions.forEach(t => csv += `"${t.id}","${t.date}","${t.items}","${t.total}"\n`);
            const link = document.createElement("a");
            link.href = encodeURI("data:text/csv;charset=utf-8," + csv);
            link.download = `Laporan_Penjualan_${Date.now()}.csv`;
            link.click();
        }

        function copyForGoogleSheets() {
            if (!transactions.length) return alert('Belum ada transaksi!');
            let text = "ID Transaksi\tTanggal\tItem\tTotal\n";
            transactions.forEach(t => text += `${t.id}\t${t.date}\t${t.items}\t${t.total}\n`);
            navigator.clipboard.writeText(text);
            alert('Data berhasil disalin! Silakan paste (Ctrl+V) di Google Sheets.');
        }

        function switchTab(tab) {}
    </script>
</body>
</html>
